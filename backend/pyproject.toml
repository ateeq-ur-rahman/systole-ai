[project]
name = "systole-storage-manager"
version = "0.1.0"
description = "Systole AI - Storage Manager: AI-powered storage monitoring and duplicate management for Windows"
requires-python = ">=3.12"
readme = "README.md"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --cov=app --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
