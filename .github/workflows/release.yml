name: Build and Release Systole AI

# Triggered by pushing a version tag, e.g.:
#   git tag v0.2.0
#   git push origin v0.2.0
#
# Builds the Windows installer (freezes the Python backend with
# PyInstaller, then bundles it into the Tauri desktop app) and publishes
# it to a SEPARATE, PUBLIC releases repo -- this repo (the source code)
# stays private, but anyone can download the installer with no GitHub
# account or permissions needed, from the public repo's Releases page.
#
# This requires one-time setup:
#   1. Create a public repo to hold releases, e.g. "systole-ai-releases"
#      (empty is fine -- it never needs any source code in it).
#   2. Create a GitHub Personal Access Token with permission to push
#      releases to that repo (Settings -> Developer settings -> Personal
#      access tokens -> Fine-grained tokens -> scope it to just that one
#      repo, "Contents: Read and write" permission).
#   3. Add that token as a secret named RELEASE_REPO_TOKEN on THIS
#      (private) repo: Settings -> Secrets and variables -> Actions ->
#      New repository secret.
#   4. Set RELEASE_REPO below to "your-username/systole-ai-releases".

env:
  RELEASE_REPO: YOUR-USERNAME/systole-ai-releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}  # also allow manually triggering a build from the Actions tab, without a tag

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "frontend/src-tauri -> target"

      # --- 1. Install backend dependencies and freeze it into an .exe ---
      # Mirrors scripts/build.ps1's first step, but installs directly
      # (no venv needed -- this runner is thrown away after the job).

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run backend test suite
        working-directory: backend
        run: python -m pytest -q --no-cov

      - name: Freeze backend into systole-service.exe
        working-directory: backend
        run: >
          pyinstaller
          --name systole-service
          --onefile
          --noconsole
          --add-data "app/database/schema.sql;app/database"
          --collect-all watchdog
          run.py

      - name: Copy frozen backend into Tauri resources
        run: Copy-Item -Force "backend\dist\systole-service.exe" "frontend\src-tauri\systole-service.exe"

      # --- 2. Set the app version to match the git tag, automatically ---
      # This is what tags like v1.9.3 actually control from here on --
      # tauri.conf.json/Cargo.toml's own version fields are no longer
      # something anyone needs to remember to bump by hand before
      # tagging. A tag "v1.9.3" becomes app version "1.9.3"; this step
      # fails loudly if the tag doesn't look like a version at all,
      # rather than silently building something with a stale/wrong
      # version baked in.

      - name: Set app version from git tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v?(\d+\.\d+\.\d+)$') {
            Write-Error "Tag '$tag' doesn't look like a version (expected e.g. v1.9.3). Refusing to guess a version."
            exit 1
          }
          $version = $Matches[1]
          Write-Host "Setting app version to $version (from tag $tag)"

          $confPath = "frontend\src-tauri\tauri.conf.json"
          $conf = Get-Content $confPath -Raw | ConvertFrom-Json
          $conf.version = $version
          $conf | ConvertTo-Json -Depth 20 | Set-Content $confPath

          $cargoPath = "frontend\src-tauri\Cargo.toml"
          (Get-Content $cargoPath) -replace '^version = ".*"', "version = `"$version`"" | Set-Content $cargoPath

      # --- 3. Build the frontend + Tauri desktop bundle ---
      # No GITHUB_TOKEN passed here and no tagName given to tauri-action
      # -- that's what keeps it in "build only" mode, since publishing
      # needs to happen against a DIFFERENT repo below, which
      # tauri-action itself doesn't support targeting.

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: frontend

      # --- 3. Publish the built installer to the PUBLIC releases repo ---
      # softprops/action-gh-release supports targeting a repository other
      # than the one the workflow runs in, authenticated with the PAT
      # stored as RELEASE_REPO_TOKEN (see setup notes above).

      - name: Publish installer to public releases repo
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASE_REPO }}
          token: ${{ secrets.RELEASE_REPO_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: "Systole AI ${{ github.ref_name }}"
          draft: true
          prerelease: false
          body: |
            Download the `.msi` below, double-click to install, and launch Systole AI from your Start Menu.

            First run may show a Windows SmartScreen warning (the installer isn't code-signed yet) --
            click "More info" then "Run anyway" to proceed. This only appears once per version.
          files: |
            frontend/src-tauri/target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/bundle/nsis/*.exe
